    <link rel="stylesheet" href="style.css">
    <title>Perpustakaan</title>
</head>

                <span>RegLibrary</span>

            <!-- TOMBOL TOGGLER (Untuk Layar HP) -->

                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- MENU NAVBAR -->
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <!-- mx-auto menempatkan posisi menu persis di tengah -->
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                    <!-- <li class="nav-item">
                        <a class="nav-link" href="index.html">Beranda</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Tentang</a>

                    <li class="nav-item">

    <div class="container">
    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            
            <!-- HEADER & TOMBOL TAMBAH DUMMY -->
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
                <div>
                    <h3 class="fw-bold text-primary mb-1">Pengelolaan Anggota</h3>
                    <p class="text-muted small mb-0">Kelola, cari, edit, dan hapus data anggota terdaftar RegLibrary.</p>
                </div>                
            </div>

            <!-- ALERT NOTIFIKASI -->
            <div id="alertContainer"></div>

            <!-- FITUR PENCARIAN -->
            <div class="row mb-3">
                <div class="col-md-6 col-lg-4">
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0">🔍</span>
                        <input type="text" id="searchInput" class="form-control border-start-0" placeholder="Cari berdasarkan nama atau NIM/NIP...">
                    </div>
                </div>
            </div>

            <!-- TABEL DAFTAR ANGGOTA -->
            <div class="table-responsive">
                <table class="table table-hover align-middle border">
                    <thead class="table-primary">
                        <tr>
                            <th>#</th>
                            <th>NIM / NIP</th>
                            <th>Nama Lengkap</th>
                            <th>Jenis</th>
                            <th>Prodi</th>
                            <th>Email</th>
                            <th class="text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tabelAnggotaBody">
                        <!-- Data diisi secara dinamis lewat JavaScript -->
                    </tbody>
                </table>
            </div>

        </div>
    </div>
</div>

<!-- 1. MODAL DETAIL ANGGOTA -->
<div class="modal fade" id="modalDetail" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title fw-bold">Detail Anggota</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <ul class="list-group list-group-flush" id="detailContent">
                    <!-- Ditampilkan via JS -->
                </ul>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
            </div>
        </div>
    </div>
</div>

<!-- 2. MODAL EDIT ANGGOTA -->
<div class="modal fade" id="modalEdit" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold">Edit Data Anggota</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="formEdit">
                    <input type="hidden" id="editIndex">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">NIM / NIP</label>
                        <input type="text" id="editNim" class="form-control" readonly>
                        <small class="text-muted">NIM/NIP bersifat unik dan tidak dapat diubah.</small>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nama Lengkap *</label>
                        <input type="text" id="editNama" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Jenis Keanggotaan *</label>
                        <select id="editJenis" class="form-select" required>
                            <option value="Mahasiswa">Mahasiswa</option>
                            <option value="Dosen">Dosen</option>
                            <option value="Tenaga Kependidikan">Tenaga Kependidikan</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Program Studi *</label>
                        <input type="text" id="editProdi" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email *</label>
                        <input type="email" id="editEmail" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nomor Telepon *</label>
                        <input type="tel" id="editTelp" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Alamat *</label>
                        <textarea id="editAlamat" class="form-control" rows="2" required></textarea>
                    </div>
                    <div class="text-end">
                        <button type="button" class="btn btn-light me-2" data-bs-dismiss="modal">Batal</button>
                        <button type="submit" class="btn btn-primary">Simpan Perubahan</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- 3. MODAL KONFIRMASI HAPUS -->
<div class="modal fade" id="modalHapus" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content">
            <div class="modal-header bg-danger text-white">
                <h5 class="modal-title fw-bold">Konfirmasi Hapus</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body text-center py-4">
                <p class="mb-1">Apakah Anda yakin ingin menghapus data anggota ini?</p>
                <strong id="hapusNamaText" class="text-danger"></strong>
            </div>
            <div class="modal-footer justify-content-center">
                <button type="button" class="btn btn-light" data-bs-dismiss="modal">Batal</button>
                <button type="button" id="btnProsesHapus" class="btn btn-danger">Ya, Hapus</button>
            </div>
        </div>
    </div>
</div>












<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- JAVASCRIPT LOGIC -->
<script>
    const STORAGE_KEY = 'REG_LIBRARY_ANGGOTA';
    let dataAnggota = [];
    let indexHapusTarget = null;

    // Inisialisasi Instance Modal Bootstrap
    const modalDetailBs = new bootstrap.Modal(document.getElementById('modalDetail'));
    const modalEditBs = new bootstrap.Modal(document.getElementById('modalEdit'));
    const modalHapusBs = new bootstrap.Modal(document.getElementById('modalHapus'));

    // 1. MUAT DATA DARI LOCALSTORAGE / INITIAL DUMMY DATA
    document.addEventListener('DOMContentLoaded', function () {
        loadDataFromStorage();
        renderTable(dataAnggota);
    });

    function loadDataFromStorage() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
            dataAnggota = JSON.parse(stored);
        } else {
            // Data dummy bawaan jika localStorage masih kosong
            dataAnggota = [
                { nomorInduk: '210401001', nama: 'Ahmad Fauzi', jenis: 'Mahasiswa', prodi: 'Informatika', email: 'ahmad@mail.com', telp: '081234567890', alamat: 'Jl. Mawar No. 12' },
                { nomorInduk: '198503002', nama: 'Budi Yanto', jenis: 'Dosen', prodi: 'Sistem Informasi', email: 'budi@its.ac.id', telp: '081987654321', alamat: 'Jl. Anggrek No. 45' },
                { nomorInduk: '210401005', nama: 'Citra Dewi', jenis: 'Mahasiswa', prodi: 'Informatika', email: 'citra@mail.com', telp: '085678901234', alamat: 'Jl. Melati No. 8' }
            ];
            saveDataToStorage();
        }
    }

    function saveDataToStorage() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(dataAnggota));
    }

    // 2. RENDER TABEL & PENCARIAN
    function renderTable(listData) {
        const tabelBody = document.getElementById('tabelAnggotaBody');
        tabelBody.innerHTML = '';

        if (listData.length === 0) {
            tabelBody.innerHTML = `
                <tr>
                    <td colspan="7" class="text-center text-muted py-4">Data anggota tidak ditemukan.</td>
                </tr>`;
            return;
        }

        listData.forEach((item, index) => {
            // Menemukan index asli pada dataAnggota
            const realIndex = dataAnggota.findIndex(a => a.nomorInduk === item.nomorInduk);

            let badgeColor = 'bg-secondary';
            if (item.jenis === 'Mahasiswa') badgeColor = 'bg-info text-dark';
            if (item.jenis === 'Dosen') badgeColor = 'bg-primary';
            if (item.jenis === 'Tenaga Kependidikan') badgeColor = 'bg-warning text-dark';

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${index + 1}</td>
                <td><strong>${item.nomorInduk}</strong></td>
                <td>${item.nama}</td>
                <td><span class="badge ${badgeColor}">${item.jenis}</span></td>
                <td>${item.prodi}</td>
                <td>${item.email}</td>
                <td class="text-center">
                    <button class="btn btn-sm btn-info text-white me-1" onclick="bukaDetail(${realIndex})">Detail</button>
                    <button class="btn btn-sm btn-warning text-dark me-1" onclick="bukaEdit(${realIndex})">Edit</button>
                    <button class="btn btn-sm btn-danger" onclick="konfirmasiHapus(${realIndex})">Hapus</button>
                </td>
            `;
            tabelBody.appendChild(tr);
        });
    }

    // Filter Pencarian (Nama / NIM / NIP)
    document.getElementById('searchInput').addEventListener('input', function (e) {
        const keyword = e.target.value.toLowerCase().trim();
        const hasilFilter = dataAnggota.filter(item => 
            item.nama.toLowerCase().includes(keyword) || 
            item.nomorInduk.toLowerCase().includes(keyword)
        );
        renderTable(hasilFilter);
    });

    // 3. FITUR DETAIL ANGGOTA
    function bukaDetail(index) {
        const item = dataAnggota[index];
        const detailContent = document.getElementById('detailContent');
        
        detailContent.innerHTML = `
            <li class="list-group-item"><strong>NIM / NIP:</strong> ${item.nomorInduk}</li>
            <li class="list-group-item"><strong>Nama Lengkap:</strong> ${item.nama}</li>
            <li class="list-group-item"><strong>Jenis Keanggotaan:</strong> ${item.jenis}</li>
            <li class="list-group-item"><strong>Program Studi:</strong> ${item.prodi}</li>
            <li class="list-group-item"><strong>Email:</strong> ${item.email}</li>
            <li class="list-group-item"><strong>No. Telepon:</strong> ${item.telp}</li>
            <li class="list-group-item"><strong>Alamat:</strong> ${item.alamat}</li>
        `;
        
        modalDetailBs.show();
    }

    // 4. FITUR EDIT ANGGOTA
    function bukaEdit(index) {
        const item = dataAnggota[index];
        document.getElementById('editIndex').value = index;
        document.getElementById('editNim').value = item.nomorInduk;
        document.getElementById('editNama').value = item.nama;
        document.getElementById('editJenis').value = item.jenis;
        document.getElementById('editProdi').value = item.prodi;
        document.getElementById('editEmail').value = item.email;
        document.getElementById('editTelp').value = item.telp;
        document.getElementById('editAlamat').value = item.alamat;

        modalEditBs.show();
    }

    document.getElementById('formEdit').addEventListener('submit', function (e) {
        e.preventDefault();
        const index = document.getElementById('editIndex').value;

        // Update objek di array
        dataAnggota[index].nama = document.getElementById('editNama').value.trim();
        dataAnggota[index].jenis = document.getElementById('editJenis').value;
        dataAnggota[index].prodi = document.getElementById('editProdi').value.trim();
        dataAnggota[index].email = document.getElementById('editEmail').value.trim();
        dataAnggota[index].telp = document.getElementById('editTelp').value.trim();
        dataAnggota[index].alamat = document.getElementById('editAlamat').value.trim();

        saveDataToStorage();
        renderTable(dataAnggota);
        modalEditBs.hide();
        tampilkanAlert('success', `Data anggota <b>${dataAnggota[index].nama}</b> berhasil diperbarui.`);
    });

    // 5. FITUR HAPUS DENGAN KONFIRMASI
    function konfirmasiHapus(index) {
        indexHapusTarget = index;
        document.getElementById('hapusNamaText').textContent = `${dataAnggota[index].nama} (${dataAnggota[index].nomorInduk})`;
        modalHapusBs.show();
    }

    document.getElementById('btnProsesHapus').addEventListener('click', function () {
        if (indexHapusTarget !== null) {
            const namaDihapus = dataAnggota[indexHapusTarget].nama;
            dataAnggota.splice(indexHapusTarget, 1);
            
            saveDataToStorage();
            renderTable(dataAnggota);
            modalHapusBs.hide();
            
            tampilkanAlert('success', `Data anggota <b>${namaDihapus}</b> berhasil dihapus.`);
            indexHapusTarget = null;
        }
    });

    // 6. HELPER NOTIFIKASI ALERT
    function tampilkanAlert(type, message) {
        const container = document.getElementById('alertContainer');
        container.innerHTML = `
            <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        `;
    }

    // Helper Reset Data ke Dummy
    function resetDataDummy() {
        localStorage.removeItem(STORAGE_KEY);
        loadDataFromStorage();
        renderTable(dataAnggota);
        tampilkanAlert('info', 'Data berhasil direset ke data awal.');
    }
</script>
    
</body>
</html>
